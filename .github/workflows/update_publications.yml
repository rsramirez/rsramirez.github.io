name: Update Publications

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:
    # Allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r _scripts/requirements.txt

      - name: Fetch publications from NASA ADS
        env:
          ADS_DEV_KEY:   ${{ secrets.ADS_DEV_KEY }}
          AUTHOR_ORCID:  ${{ secrets.AUTHOR_ORCID }}
        run: python _scripts/fetch_publications.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.json
          # Only commit when there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to publications data."
          else
            git commit -m "chore: update publications data [skip ci]"
            git push
          fi
