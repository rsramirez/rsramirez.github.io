<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active" aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications' %} class="active" aria-current="page"{% endif %}>Publications</a>
      </nav>
    </div>
  </header>

  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>
        &copy; {{ 'now' | date: '%Y' }} {{ site.title }}
        &nbsp;&middot;&nbsp;
        Data from <a href="https://ui.adsabs.harvard.edu" target="_blank" rel="noopener">NASA ADS</a>
        &nbsp;&middot;&nbsp;
        Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a>
      </p>
    </div>
  </footer>
</body>
</html>
